name: macOS CI

# The mac/ scripts and the shared code they depend on had no CI at all, so a
# macOS-only breakage (a removed `brew bundle` flag, say) only ever surfaced by
# running the bootstrap by hand.
#
# This job deliberately does NOT run the full bootstrap: installing every cask
# in the Brewfile would take far too long on a hosted runner. It checks the
# things that can be checked statically, plus the steps that are safe to run
# for real on a throwaway machine.

on:
  push:
    branches: [main, master, 'feat/**']
    paths:
      - 'mac/**'
      - 'dotfiles/**'
      - 'shared/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'mac/**'
      - 'dotfiles/**'
      - 'shared/**'
      - 'packages/**'
  schedule:
    # Weekly, to catch upstream breakage in Homebrew and the release APIs.
    - cron: '0 6 * * 1'

defaults:
  run:
    working-directory: mac

jobs:
  static-checks:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      # git ls-files prints repo-root-relative paths, so these run from the
      # repo root rather than the mac/ working-directory default.
      - name: bash -n
        working-directory: .
        run: |
          while IFS= read -r f; do bash -n "$f"; done < <(
            git ls-files 'mac/*.sh' 'shared/*.sh'
          )

      - name: shellcheck
        working-directory: .
        run: |
          # No mapfile here: GitHub's macOS runners use /bin/bash, which is
          # bash 3.2, and mapfile is a bash 4 builtin.
          git ls-files 'mac/*.sh' 'shared/*.sh' \
            | xargs shellcheck -x --source-path=SCRIPTDIR

      # macOS ships bash 3.2 (2007). The bootstrap entry point and everything
      # it runs before Homebrew installs a newer bash MUST work under it,
      # otherwise ./run.sh cannot bootstrap the machine it is meant to
      # bootstrap. This job runs under that same bash 3.2, so it is the right
      # place to catch bash 4+ syntax creeping back in.
      - name: bash 3.2 compatibility (mac entry points)
        working-directory: .
        run: |
          echo "checking with: $(bash --version | head -1)"
          # mapfile/readarray and ${var^^}/${var,,} and declare -A are bash 4;
          # the auto-allocating `exec {fd}>&1` form is bash 4.1.
          #
          # Comment lines are skipped: several of these constructs are named in
          # comments precisely to explain why they are avoided.
          pattern='(^|[^[:alnum:]_])(mapfile|readarray)[[:space:]]'
          pattern="$pattern"'|\$\{[A-Za-z_][A-Za-z0-9_]*(\^\^|,,)\}'
          pattern="$pattern"'|exec[[:space:]]+\{[A-Za-z_]'
          pattern="$pattern"'|(declare|local)[[:space:]]+-A[[:space:]]'

          fail=0
          while IFS= read -r f; do
            hits="$(grep -vE '^[[:space:]]*#' "$f" | grep -nE "$pattern" || true)"
            if [ -n "$hits" ]; then
              echo "::error file=$f::uses bash 4+ syntax but must run on stock macOS bash 3.2"
              echo "$hits"
              fail=1
            fi
          done < <(git ls-files 'mac/*.sh' 'shared/*.sh')
          exit $fail

      - name: zsh -n (zsh dotfiles)
        working-directory: .
        run: |
          for f in dotfiles/.zshenv dotfiles/.zshrc dotfiles/.zprofile; do
            zsh -n "$f"
          done

      - name: Brewfile is valid
        run: brew bundle list --file=Brewfile >/dev/null

      - name: run.sh --help
        run: ./run.sh --help

  bootstrap:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Steps that are safe and quick on a hosted runner. The system step is
      # skipped: it would install the full Brewfile including GUI casks.
      - name: Dotfiles bootstrap
        run: ./run.sh --only dotfiles

      - name: Configure (non-interactive, identity from env)
        env:
          DEVSETUP_GIT_NAME: CI Runner
          DEVSETUP_GIT_EMAIL: ci@example.com
        run: ./run.sh --only configure

      - name: Git identity was actually written
        run: |
          test "$(git config --file ~/.gitconfig.local user.email)" = "ci@example.com"

      - name: Agents bootstrap
        run: ./run.sh --only agents

      - name: Shared instructions reach every agent
        run: |
          test -L ~/.claude/CLAUDE.md
          test -L ~/.codex/AGENTS.md
          grep -q "$HOME/.config/agents/instructions.md" ~/.config/opencode/config.json

      - name: Verify (report only; a bare runner will not pass everything)
        run: ./run.sh --verify || true
