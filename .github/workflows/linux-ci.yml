name: Linux CI

on:
  push:
    branches:
      - main
    paths:
      - 'linux/**'
      - 'dotfiles/**'
      - 'shared/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'linux/**'
      - 'dotfiles/**'
      - 'shared/**'
      - 'packages/**'

defaults:
  run:
    working-directory: linux

jobs:
  bootstrap-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: Run bootstrap checks
        run: bash scripts/test.sh

  system-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Run the full system step on a real Ubuntu 24.04 VM.
      # UFW is skipped -- enabling it would block the runner's own network access.
      # Everything else (apt, GitHub tools, cloud CLIs, uv, mise, npm, Docker,
      # Chrome, runtimes) runs for real.
      - name: System bootstrap
        env:
          MACHINIST_SMOKE_FULL: "1"
          MACHINIST_SKIP_UFW: "1"
          DEBIAN_FRONTEND: noninteractive
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/smoke-system.sh

      # The runner image ships its own aws and gcloud, so the step above takes
      # the "already installed" branch and never exercises either installer.
      # Force them to run and assert they land in ~/.local, which is what a
      # real Ubuntu machine without them would do.
      - name: Cloud CLI installers (forced)
        env:
          MACHINIST_UPGRADE: "1"
        run: |
          set -euo pipefail
          # system.sh ends with a bare `main`, so strip that before sourcing or
          # this re-runs the entire bootstrap. Same trick the unit tests use.
          # The copy stays inside system/ so SCRIPT_DIR still resolves and its
          # own `source ../utils/utils.sh` keeps working.
          sed '/^main$/d' system/system.sh > system/system-sourceable.sh
          # shellcheck disable=SC1091
          source system/system-sourceable.sh
          install_cloud_clis

          test -x "$HOME/.local/bin/aws"
          test -x "$HOME/.local/bin/gcloud"
          "$HOME/.local/bin/aws" --version
          "$HOME/.local/bin/gcloud" version

      - name: Verify installed commands
        env:
          MACHINIST_SKIP_WEZTERM: "1"
          MACHINIST_SKIP_NEOVIM: "1"
          MACHINIST_SKIP_FONTS: "1"
        run: bash scripts/verify-system-smoke.sh

      - name: Dotfiles bootstrap
        run: bash run.sh --only dotfiles

      # Install antidote and powerlevel10k so the startup budget below is
      # measured against a REALLY configured shell. Without this the measured
      # zsh has no plugins and no prompt, and the number is a meaningless floor.
      - name: Shell bootstrap (plugins + prompt)
        run: bash run.sh --only shell

      - name: Agents bootstrap
        run: bash run.sh --only agents
      # Startup speed is a stated goal, so measure it on the real target OS
      # rather than trusting a number measured on a laptop. Budgets are
      # generous: this is here to catch a regression (an uncached eval, an
      # eagerly loaded plugin), not to police milliseconds on a shared runner.
      - name: Shell startup budget
        run: |
          set -e
          measure() {
            best=99
            for _ in 1 2 3 4 5; do
              t=$( { /usr/bin/time -p "$1" -lic 'exit' ; } 2>&1 | awk '/^real/{print $2}' )
              [ -z "$t" ] && continue
              best=$(awk -v a="$t" -v b="$best" 'BEGIN{print (a<b)?a:b}')
            done
            awk -v b="$best" 'BEGIN{printf "%d", b*1000}'
          }
          fail=0
          for shell in zsh bash; do
            command -v "$shell" >/dev/null 2>&1 || continue
            ms=$(measure "$shell")
            budget=$([ "$shell" = zsh ] && echo 400 || echo 500)
            echo "$shell startup: ${ms}ms (budget ${budget}ms)"
            if [ "$ms" -gt "$budget" ]; then
              echo "::error::$shell startup ${ms}ms exceeds the ${budget}ms budget"
              fail=1
            fi
          done
          exit $fail
