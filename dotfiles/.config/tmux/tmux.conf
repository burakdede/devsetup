# Tmux configuration
# ~/.config/tmux/tmux.conf
#
# Requires tmux 3.2+ (XDG config dir needs 3.1; terminal-features needs 3.2).
# TPM (Tmux Plugin Manager) is bootstrapped by multiplexer/multiplexer.sh.
#
# Fill in your personal customisations below; the settings here provide
# sensible defaults and proper colour support for neovim and zsh.

# ─── Prefix ───────────────────────────────────────────────────────────────────
# Change the prefix key. Common alternatives: C-a (screen style), C-Space.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ─── General ──────────────────────────────────────────────────────────────────
# Use zsh in new windows/panes.
set -g default-shell "$SHELL"
set -g default-command "$SHELL -l"
set -g history-limit 50000             # scrollback buffer
set -g base-index 1                    # start window numbering at 1
setw -g pane-base-index 1             # start pane numbering at 1
set -g renumber-windows on             # renumber when a window is closed
set -g mouse on                        # enable mouse support
# escape-time must stay 0, not 10: tmux-sensible sets 0 and loads after this
# file, so a non-zero value here is silently overridden. Keeping them in
# agreement avoids a confusing mismatch between config and behaviour.
set -g escape-time 0                   # no escape delay (important for neovim)
set -g focus-events on                 # pass focus events to terminals

# ─── Terminal colour support ──────────────────────────────────────────────────
# These settings allow neovim to render true colour correctly inside tmux.
set -g default-terminal "tmux-256color"

# terminal-features is the modern replacement for the terminal-overrides
# capability hacks, and ",*:RGB" covers every outer terminal rather than an
# enumerated list. The previous ",wezterm:RGB" entry was dead code: wezterm.lua
# sets TERM to xterm-256color, so the outer TERM was never "wezterm".
set -as terminal-features ",*:RGB"

# Coloured undercurl. Without this, LSP diagnostics all render as the same flat
# underline, so an error is indistinguishable from a warning or a hint.
#
# Neither the tmux-256color nor the xterm-256color terminfo entry advertises
# Smulx/Setulc, so Neovim will not emit the escapes unless tmux declares the
# capability. "usstyle" is tmux's own name for it and needs no custom terminfo
# on either platform, which is why it is preferred over hand-rolled
# terminal-overrides for Smulx/Setulc.
set -as terminal-features ",*:usstyle"

# ─── Clipboard ────────────────────────────────────────────────────────────────
# Forward tmux's copy buffer to the system clipboard over OSC 52. Without this,
# `y` in copy-mode fills only the tmux buffer and the text never reaches the OS.
#
# OSC 52 is what makes copy behave identically on macOS and Ubuntu: no pbcopy
# vs xclip vs wl-copy branching, and it keeps working over SSH. WezTerm
# supports it on both platforms.
set -g set-clipboard on

# ─── Status bar ───────────────────────────────────────────────────────────────
# Un-comment and customise your preferred status bar below.
# set -g status-position top
# set -g status-style "bg=default"
# set -g status-left  "[#S] "
# set -g status-right " %H:%M "

# ─── Vi mode ──────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ─── Pane splitting ───────────────────────────────────────────────────────────
# Intuitive split bindings that open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (vim-style) ──────────────────────────────────────────────
# Integrates with christoomey/vim-tmux-navigator plugin for seamless
# neovim ↔ tmux pane switching with the same keys.
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# ─── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ─── Plugins (TPM) ────────────────────────────────────────────────────────────
# Add plugins here and press <prefix> + I to install.
# TPM itself is installed at ~/.local/share/tmux/plugins/tpm by multiplexer/multiplexer.sh.
#
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# set -g @plugin 'catppuccin/tmux'

# ─── TPM bootstrap (keep at the very bottom) ──────────────────────────────────
# Un-comment the line below when you start using TPM plugins.
if-shell '[ -d ~/.local/share/tmux/plugins/tpm ]' "run '~/.local/share/tmux/plugins/tpm/tpm'"
